<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AuctionX</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{
  font-family:'Share Tech Mono',monospace;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:0;
  background-image:
    linear-gradient(rgba(124,47,219,0.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(124,47,219,0.07) 1px,transparent 1px);
  background-size:48px 48px;
}

/* center glow */
body::before{
  content:'';position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(124,47,219,0.15) 0%,transparent 65%);
  pointer-events:none;
}

/* ring container */
.ring-wrap{
  position:relative;
  width:280px;height:280px;
  flex-shrink:0;
}
.ring-svg{width:100%;height:100%}

/* outer dashed ring */
.r-outer{
  fill:none;stroke:rgba(124,47,219,0.2);stroke-width:1;
  stroke-dasharray:3 7;
  animation:spin 20s linear infinite;
  transform-origin:center;
}
/* tick marks */
.r-ticks{fill:none;stroke:rgba(168,85,247,0.3);stroke-width:1.5}
/* track */
.r-track{fill:none;stroke:rgba(168,85,247,0.08);stroke-width:5}
/* progress arc */
.r-arc{
  fill:none;
  stroke:url(#g);stroke-width:5;stroke-linecap:round;
  stroke-dasharray:816;stroke-dashoffset:816;
  transform:rotate(-90deg);transform-origin:center;
  filter:drop-shadow(0 0 8px rgba(168,85,247,0.9));
  transition:stroke-dashoffset 0.06s linear;
}
/* inner ring */
.r-inner{
  fill:none;stroke:rgba(168,85,247,0.1);stroke-width:1;
  stroke-dasharray:2 5;
  animation:spin 10s linear infinite reverse;
  transform-origin:center;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* center content */
.ring-center{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:6px;
}
.ring-logo{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(22px,5vw,34px);font-weight:900;
  letter-spacing:0.1em;color:#ffffff;
  text-shadow:0 0 30px rgba(168,85,247,0.7);
  opacity:0;transition:opacity 0.6s ease;
}
.ring-logo.show{opacity:1}
.ring-logo span{color:#c084fc}
.ring-pct{
  font-size:15px;letter-spacing:0.2em;
  color:#a855f7;font-weight:700;
}

/* terminal */
.terminal{
  margin-top:28px;
  width:280px;height:100px;
  overflow:hidden;position:relative;
}
.terminal::before{
  content:'';position:absolute;top:0;left:0;right:0;height:28px;
  background:linear-gradient(to bottom,#000,transparent);z-index:2;
}
.log-inner{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;flex-direction:column;gap:5px;
}
.log-line{
  font-size:10px;letter-spacing:0.06em;line-height:1.5;
  opacity:0;transform:translateY(4px);
  transition:opacity 0.3s,transform 0.3s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.log-line.show{opacity:1;transform:translateY(0)}
.ok{color:#4ade80}
.info{color:#ffffff}
.warn{color:#facc15}

/* bottom */
.bottom{
  position:fixed;bottom:0;left:0;right:0;
  height:40px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;
  border-top:1px solid rgba(168,85,247,0.15);
  background:rgba(0,0,0,0.7);
  opacity:0;transition:opacity 0.5s;
}
.bottom.show{opacity:1}
.bitem{font-size:9px;letter-spacing:0.25em;text-transform:uppercase;color:rgba(255,255,255,0.3)}

/* exit */
#veil{position:fixed;inset:0;z-index:99;background:#000;opacity:0;pointer-events:none;transition:opacity 0.7s}
#veil.go{opacity:1;pointer-events:all}
</style>
</head>
<body>

<div class="ring-wrap">
  <svg class="ring-svg" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#4c1174"/>
        <stop offset="50%" stop-color="#a855f7"/>
        <stop offset="100%" stop-color="#c084fc"/>
      </linearGradient>
    </defs>
    <circle class="r-outer" cx="140" cy="140" r="135"/>
    <circle class="r-inner" cx="140" cy="140" r="108"/>
    <g id="ticks"></g>
    <circle class="r-track" cx="140" cy="140" r="130"/>
    <circle class="r-arc"   cx="140" cy="140" r="130" id="arc"/>
  </svg>
  <div class="ring-center">
    <div class="ring-logo" id="logo">AUCTION<span>X</span></div>
    <div class="ring-pct" id="pct">0%</div>
  </div>
</div>

<div class="terminal">
  <div class="log-inner" id="logInner"></div>
</div>

<div class="bottom" id="bottom">
  <span class="bitem">AuctionX v1.0</span>
  <span class="bitem">Team Exception</span>
  <span class="bitem">Hackathon 2025</span>
</div>

<div id="veil"></div>

<script>
/* ticks */
(function(){
  const g=document.getElementById('ticks');
  for(let i=0;i<48;i++){
    const a=(i/48)*Math.PI*2-Math.PI/2;
    const maj=i%4===0;
    const r1=maj?120:124,r2=132;
    const x1=140+r1*Math.cos(a),y1=140+r1*Math.sin(a);
    const x2=140+r2*Math.cos(a),y2=140+r2*Math.sin(a);
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',x1);l.setAttribute('y1',y1);
    l.setAttribute('x2',x2);l.setAttribute('y2',y2);
    l.setAttribute('stroke',maj?'rgba(168,85,247,0.55)':'rgba(124,47,219,0.2)');
    l.setAttribute('stroke-width',maj?'2':'1');
    g.appendChild(l);
  }
})();

/* logs */
const logs=[
  {c:'info',t:'Booting AuctionX kernel...'},
  {c:'ok',  t:'Memory allocated — 512MB'},
  {c:'info',t:'Starting WebSocket server'},
  {c:'ok',  t:'Socket.io bound to :8080'},
  {c:'info',t:'Connecting to MongoDB...'},
  {c:'ok',  t:'Database connected'},
  {c:'info',t:'Loading JWT middleware'},
  {c:'ok',  t:'Auth layer ready'},
  {c:'info',t:'Fetching auction catalog'},
  {c:'ok',  t:'12 auctions loaded'},
  {c:'warn',t:'AI model warming up...'},
  {c:'ok',  t:'All systems go — launching'},
];
const li=document.getElementById('logInner');
let idx=0;
function addLog(){
  if(idx>=logs.length)return;
  const l=logs[idx++];
  const d=document.createElement('div');
  d.className='log-line '+l.c;
  d.textContent='['+(l.c==='ok'?'OK':l.c==='warn'?'WARN':'INFO')+'] '+l.t;
  li.appendChild(d);
  requestAnimationFrame(()=>d.classList.add('show'));
  if(li.children.length>6){
    const first=li.children[0];
    first.style.opacity='0';
    setTimeout(()=>first.parentNode&&first.parentNode.removeChild(first),300);
  }
}

/* progress */
const arc=document.getElementById('arc');
const pctEl=document.getElementById('pct');
const CIRC=2*Math.PI*130;
let p=0,done=false;

function setArc(v){
  arc.style.strokeDashoffset=CIRC*(1-v/100);
  pctEl.textContent=Math.floor(v)+'%';
}

function redirect(){
  if(done)return;done=true;
  document.getElementById('veil').classList.add('go');
  setTimeout(()=>location.href='index.html',800);
}

/* sequence */
setTimeout(()=>{
  document.getElementById('bottom').classList.add('show');
  document.getElementById('logo').classList.add('show');
},300);

setTimeout(()=>{
  addLog();
  const iv=setInterval(()=>{addLog();if(idx>=logs.length)clearInterval(iv)},260);
},600);

setTimeout(()=>{
  let speed=1.4;
  const iv=setInterval(()=>{
    if(done){clearInterval(iv);return}
    if(p>=100){clearInterval(iv);
      pctEl.textContent='✓ READY';pctEl.style.color='#4ade80';
      setTimeout(redirect,600);return;
    }
    if(p>88)speed=0.35;
    p=Math.min(p+speed*(0.7+Math.random()*0.6),100);
    setArc(p);
  },55);
},800);

let sk=false;
document.addEventListener('click',()=>{if(!sk){sk=true;redirect()}});
document.addEventListener('keydown',()=>{if(!sk){sk=true;redirect()}});
</script>
</body>
</html>
